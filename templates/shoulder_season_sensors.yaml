# ============================================================
# SHOULDER SEASON SENSORS
# Spring + Fall
# Baseline / Nudge / Boost / Mode / Color
# ============================================================

- sensor:
    # --------------------------------------------------------
    # CURRENT SHOULDER SEASON MODE (TEXT)
    # --------------------------------------------------------
    - name: shoulder_season_current_mode
      state: >
        {% set boost = is_state('input_boolean.temporary_boost_active', 'on') %}
        {% set spring = is_state('input_select.current_season', 'Spring') %}
        {% set fall = is_state('input_select.current_season', 'Fall') %}

        {% if boost %}
        BOOST ACTIVE

        {% elif spring %}
          {% set logs = [
            states('input_text.spring_shoulder_warm_day_log'),
            states('input_text.spring_shoulder_cool_day_log'),
            states('input_text.spring_shoulder_baseline_log')
          ] %}
          {{ logs
              | reject('equalto','')
              | reject('equalto','unknown')
              | map('regex_replace', ' — .*', '')
              | list
              | first
              | default('INACTIVE')
          }}

        {% elif fall %}
          {% set logs = [
            states('input_text.fall_shoulder_warm_day_log'),
            states('input_text.fall_shoulder_cool_day_log'),
            states('input_text.fall_shoulder_baseline_log')
          ] %}
          {{ logs
              | reject('equalto','')
              | reject('equalto','unknown')
              | map('regex_replace', ' — .*', '')
              | list
              | first
              | default('INACTIVE')
          }}

        {% else %}
          INACTIVE
        {% endif %}

    # --------------------------------------------------------
    # CURRENT SHOULDER SEASON MODE (COLOR)
    # --------------------------------------------------------
    - name: shoulder_season_mode_color
      state: >
        {% set raw = states('sensor.shoulder_season_current_mode') %}

        {% if 'BOOST' in raw %}
          purple
        {% elif 'WARM-DAY COOLING' in raw %}
          orange
        {% elif 'COOL-DAY HEATING' in raw %}
          blue
        {% elif 'BASELINE' in raw %}
          green
        {% else %}
          grey
        {% endif %}

    # --------------------------------------------------------
    # LAST NUDGE (TEXT)
    # --------------------------------------------------------
    - name: shoulder_last_nudge_text
      state: >
        {% set logs = [
          states('input_text.spring_shoulder_warm_day_log'),
          states('input_text.spring_shoulder_cool_day_log'),
          states('input_text.fall_shoulder_warm_day_log'),
          states('input_text.fall_shoulder_cool_day_log')
        ] %}

        {% set valid = logs | select('string') | reject('equalto','') | list %}
        {% if valid | count > 0 %}
          {{ valid | sort | last }}
        {% else %}
          NONE
        {% endif %}

    # --------------------------------------------------------
    # LAST NUDGE (COLOR)
    # --------------------------------------------------------
    - name: shoulder_last_nudge_color
      state: >
        {% set raw = states('sensor.shoulder_last_nudge_text') %}
        {% if 'WARM-DAY COOLING' in raw %}
          orange
        {% elif 'COOL-DAY HEATING' in raw %}
          blue
        {% else %}
          grey
        {% endif %}

    # --------------------------------------------------------
    # LAST BASELINE (TEXT)
    # --------------------------------------------------------
    - name: shoulder_last_baseline_text
      state: >
        {% set logs = [
          states('input_text.spring_shoulder_baseline_log'),
          states('input_text.fall_shoulder_baseline_log')
        ] %}

        {% set valid = logs | select('string') | reject('equalto','') | list %}
        {% if valid | count > 0 %}
          {{ valid | sort | last }}
        {% else %}
          NONE
        {% endif %}
