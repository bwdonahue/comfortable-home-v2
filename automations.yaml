          ''input_number.fall_cool_day_cool_temp'' ] }}'
      sequence:
      - variables:
          heat: '{{ states(''input_number.fall_cool_day_heat_temp'') | int }}'
          cool: '{{ states(''input_number.fall_cool_day_cool_temp'') | int }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ changed == ''input_number.fall_cool_day_heat_temp''
              }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ cool != heat + 6 }}'
              sequence:
              - target:
                  entity_id: input_number.fall_cool_day_cool_temp
                data:
                  value: '{{ heat + 6 }}'
                action: input_number.set_value
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ changed == ''input_number.fall_cool_day_cool_temp''
              }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ heat != cool - 6 }}'
              sequence:
              - target:
                  entity_id: input_number.fall_cool_day_heat_temp
                data:
                  value: '{{ cool - 6 }}'
                action: input_number.set_value
  mode: queued
