- id: '1785936671091'
  alias: Stage 2B - Store Previous HVAC State
  description: Saves HVAC mode and setpoint when Vacation Mode is activated
  triggers:
  - entity_id: input_boolean.vacation_mode
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  actions:
  - target:
      entity_id: input_text.previous_hvac_mode
    data:
      value: "{% set mode = state_attr('climate.thermostat', 'hvac_mode') %} {% if
        mode is not none %}\n  {{ mode }}\n{% else %}\n  {{ states('climate.thermostat')
        }}\n{% endif %}\n"
    action: input_text.set_value
  - target:
      entity_id: input_number.previous_hvac_setpoint
    data:
      value: "{% set temp = state_attr('climate.thermostat', 'temperature') %} {%
        if temp is not none %}\n  {{ temp | float }}\n{% else %}\n  {{ states('climate.thermostat')
        | float(default=72) }}\n{% endif %}\n"
    action: input_number.set_value
  mode: single
