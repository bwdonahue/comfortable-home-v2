- id: '1776221000813'
  alias: Enable Maintenance Mode When Nest Is Turned Off
  triggers:
  - entity_id: climate.thermostat
    to: 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_paused
    state:
    - 'off'
  actions:
  - target:
      entity_id: input_boolean.maintenance_mode
    action: input_boolean.turn_on
  - data:
      title: Maintenance Mode Enabled
      message: Nest turned OFF — Maintenance Mode enabled.
    action: persistent_notification.create
  - data:
      payload: "{\n  \"source\": \"maintenance\",\n  \"event\": \"\U0001F6E0️ Maintenance
        Mode Enabled (Nest Off)\",\n  \"entity_id\": \"climate.thermostat\",\n  \"state\":
        \"off\",\n  \"friendly_name\": \"Thermostat\",\n  \"timestamp\": \"{{ now().isoformat()
        }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  mode: single
- id: '1776221067400'
  alias: Maintenance Mode Enabled - Store Mode
  triggers:
  - entity_id: input_boolean.maintenance_mode
    to: 'on'
    trigger: state
  actions:
  - target:
      entity_id: input_text.previous_hvac_mode
    data:
      value: '{{ state_attr(''climate.thermostat'',''hvac_mode'') }}'
    action: input_text.set_value
  mode: single
- id: '1776221117731'
  alias: Disable Maintenance Mode When Nest Is Turned On
  triggers:
  - entity_id: climate.thermostat
    to:
    - heat
    - cool
    - heat_cool
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_paused
    state:
    - 'off'
  actions:
  - target:
      entity_id: input_boolean.maintenance_mode
    action: input_boolean.turn_off
  - data:
      title: Maintenance Mode Disabled
      message: Nest turned ON — Maintenance Mode disabled.
    action: persistent_notification.create
  - data:
      payload: "{\n  \"source\": \"maintenance\",\n  \"event\": \"\U0001F527 Maintenance
        Mode Disabled (Nest On)\",\n  \"entity_id\": \"climate.thermostat\",\n  \"state\":
        \"{{ state_attr('climate.thermostat','hvac_mode') }}\",\n  \"friendly_name\":
        \"Thermostat\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  mode: single
- id: '1776297587893'
  alias: Manual Maintenance Mode Control
  triggers:
  - entity_id: input_boolean.maintenance_mode_manual
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_paused
    state:
    - 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.maintenance_mode_manual
        state: 'on'
      sequence:
      - target:
          entity_id: input_boolean.maintenance_mode_manual
        action: input_boolean.turn_on
        data: {}
      - data:
          title: Maintenance Mode Enabled
          message: Manual enable — Maintenance Mode turned ON.
        action: persistent_notification.create
      - data:
          payload: "{\n  \"source\": \"maintenance\",\n  \"event\": \"\U0001F6E0️
            Maintenance Mode Enabled (Manual)\",\n  \"timestamp\": \"{{ now().isoformat()
            }}\"\n}\n"
        action: rest_command.slack_webhook_prod
    - conditions:
      - condition: state
        entity_id: input_boolean.maintenance_mode_manual
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.maintenance_mode_manual
        action: input_boolean.turn_off
        data: {}
      - data:
          title: Maintenance Mode Disabled
          message: Manual disable — Maintenance Mode turned OFF.
        action: persistent_notification.create
      - data:
          payload: "{\n  \"source\": \"maintenance\",\n  \"event\": \"\U0001F527 Maintenance
            Mode Disabled (Manual)\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
        action: rest_command.slack_webhook_prod
  mode: single
- id: '1776299845847'
  alias: Milo – Backyard Sensors
  description: Forward meaningful Backyard environmental + security events to Milo
    (Dev/Prod aware)
  triggers:
  - entity_id:
    - sensor.st_00196977_temperature
    - sensor.st_00196977_humidity
    - sensor.st_00196977_air_pressure
    - sensor.st_00196977_wind_speed
    - sensor.st_00196977_wind_speed_average
    - sensor.st_00196977_wind_gust
    - sensor.st_00196977_lightning_average_distance
    - sensor.st_00196977_precipitation
    - sensor.st_00196977_precipitation_intensity
    - sensor.st_00196977_precipitation_type
    - sensor.st_00196977_uv_index
    - sensor.st_00196977_illuminance
    trigger: state
  - event_type: st_00196977_lightning_strike
    trigger: event
  - event_type: st_00196977_precipitation_start
    trigger: event
  - entity_id:
    - binary_sensor.backyard_motion_detected
    - binary_sensor.backyard_person_detected
    - sensor.backyard_person_name
    - binary_sensor.backyard_snooze
    - sensor.backyard_snooze_time
    - sensor.backyard_stream_status
    - sensor.backyard_current_mode
    - alarm_control_panel.backyard
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.milo_target
        state: dev
      sequence:
      - data:
          entity: '{{ trigger.entity_id if trigger.entity_id is defined else trigger.event.event_type
            }}'
          old: '{{ trigger.from_state.state if trigger.from_state is defined else
            '''' }}'
          new: '{{ trigger.to_state.state if trigger.to_state is defined else ''''
            }}'
          event_type: '{{ trigger.event.event_type if trigger.event is defined else
            ''state_changed'' }}'
        action: rest_command.milo_dev_event
    - conditions:
      - condition: state
        entity_id: input_select.milo_target
        state: prod
      sequence:
      - data:
          entity: '{{ trigger.entity_id if trigger.entity_id is defined else trigger.event.event_type
            }}'
          old: '{{ trigger.from_state.state if trigger.from_state is defined else
            '''' }}'
          new: '{{ trigger.to_state.state if trigger.to_state is defined else ''''
            }}'
          event_type: '{{ trigger.event.event_type if trigger.event is defined else
            ''state_changed'' }}'
        action: rest_command.milo_prod_event
  mode: parallel
