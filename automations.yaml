  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'on'
  - condition: template
    value_template: '{{ states(''climate.thermostat'') != ''off'' }}

      '
  - condition: template
    value_template: '{{ (now() - states.input_text.vacation_heat_wave_log.last_changed).total_seconds()
