- id: '1770260562783'
  alias: Spring + Fall 6 Degree Safety Gap Enforcement
  triggers:
  - entity_id:
    - input_number.spring_baseline_heat_temp
    - input_number.spring_baseline_cool_temp
    - input_number.spring_warm_day_heat_temp
    - input_number.spring_warm_day_cool_temp
    - input_number.spring_cool_day_heat_temp
    - input_number.spring_cool_day_cool_temp
    - input_number.fall_baseline_heat_temp
    - input_number.fall_baseline_cool_temp
    - input_number.fall_warm_day_heat_temp
    - input_number.fall_warm_day_cool_temp
    - input_number.fall_cool_day_heat_temp
    - input_number.fall_cool_day_cool_temp
    trigger: state
  - entity_id: climate.thermostat
    attribute: target_temp_low
    trigger: state
  - entity_id: climate.thermostat
    attribute: target_temp_high
    trigger: state
  actions:
  - variables:
      pairs:
      - - input_number.spring_baseline_heat_temp
        - input_number.spring_baseline_cool_temp
      - - input_number.spring_warm_day_heat_temp
        - input_number.spring_warm_day_cool_temp
      - - input_number.spring_cool_day_heat_temp
        - input_number.spring_cool_day_cool_temp
      - - input_number.fall_baseline_heat_temp
        - input_number.fall_baseline_cool_temp
      - - input_number.fall_warm_day_heat_temp
        - input_number.fall_warm_day_cool_temp
      - - input_number.fall_cool_day_heat_temp
        - input_number.fall_cool_day_cool_temp
  - repeat:
      for_each: '{{ pairs }}'
      sequence:
      - variables:
          heat_entity: '{{ repeat.item[0] }}'
          cool_entity: '{{ repeat.item[1] }}'
          heat: '{{ states(heat_entity) | int }}'
          cool: '{{ states(cool_entity) | int }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.entity_id == heat_entity }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ cool != heat + 6 }}'
              sequence:
              - target:
                  entity_id: '{{ cool_entity }}'
                data:
                  value: '{{ heat + 6 }}'
                action: input_number.set_value
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.entity_id == cool_entity }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ heat != cool - 6 }}'
              sequence:
              - target:
                  entity_id: '{{ heat_entity }}'
                data:
                  value: '{{ cool - 6 }}'
                action: input_number.set_value
  mode: queued
