- id: '1766214814422'
  alias: Winter Mode Activation
  description: Set thermostat to Heat mode with your winter baseline every November
    1st at 5 AM
  triggers:
  - at: 05:00:00
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ now().month == 11 and now().day == 1 }}'
  - condition: state
    entity_id: input_boolean.maintenance_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.hvac_paused
    state:
    - 'off'
  actions:
  - target:
      entity_id: input_select.current_season
    data:
      option: Winter
    action: input_select.select_option
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.thermostat
    data:
      hvac_mode: heat
  - action: climate.set_temperature
    target:
      entity_id: climate.thermostat
    data:
      temperature: '{{ states(''input_number.winter_baseline_temp'') | float }}'
  - action: automation.trigger
    target:
      entity_id: automation.send_winter_email
  mode: single
- id: '1766215066594'
