- id: '1784747814811'
  alias: HVAC Hardware Failure Detection
  description: Detects when HVAC is running but indoor temperature drifts the wrong
    direction for 1 hour
  triggers:
  - entity_id: climate.thermostat
    to: cooling
    for:
      hours: 1
    trigger: state
  - entity_id: climate.thermostat
    to: heating
    for:
      hours: 1
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set now_temp = states(''sensor.indoor_temperature'') | float
      %} {% set last_temp = states(''sensor.indoor_temperature'') | float %} {% set
      diff = now_temp - last_temp %} {{ diff > 1 or diff < -1 }}

      '
  - condition: state
    entity_id: input_boolean.maintenance_mode
    state:
    - 'off'
  actions:
  - data:
      payload: "{\n  \"source\": \"watchdog\",\n  \"event\": \":rotating_light: CRITICAL
        — HVAC Failure Suspected\",\n  \"entity_id\": \"sensor.indoor_temperature\",\n
        \ \"state\": \"{{ states('sensor.indoor_temperature') }}\",\n  \"friendly_name\":
        \"Indoor Temperature\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  mode: single
- id: '1784747898938'
  alias: Indoor Temperature Drift Watchdog
  description: Alerts if indoor temperature changes more than 2°F over 1 hour
  triggers:
  - entity_id: sensor.indoor_temperature
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set now_temp = states(''sensor.indoor_temperature'') | float
      %} {% set last_time = states.sensor.indoor_temperature.last_changed %} {% set
      last_temp = states(''sensor.indoor_temperature'') | float %} {% set diff = now_temp
      - last_temp %} {{ (as_timestamp(now()) - as_timestamp(last_time)) > 3600 and
      (diff > 2 or diff < -2) }}

      '
  - condition: state
    entity_id: input_boolean.maintenance_mode
    state:
    - 'off'
  actions:
  - data:
      payload: "{\n  \"source\": \"watchdog\",\n  \"event\": \":thermometer: WARNING
        — Indoor Temperature Drift\",\n  \"entity_id\": \"sensor.indoor_temperature\",\n
        \ \"state\": \"{{ states('sensor.indoor_temperature') }}\",\n  \"friendly_name\":
        \"Indoor Temperature\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  mode: single
- id: '1784773861533'
  alias: HVAC Protection – Anomaly Response
  description: Pauses cooling when HVAC anomaly score indicates a fault
  triggers:
  - entity_id: sensor.hvac_anomaly_score
    above: 8
    for:
      minutes: 5
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: climate.thermostat
    state: cool
  - condition: numeric_state
    entity_id: sensor.ac_runtime_current_cycle
    above: 5
  - condition: state
    entity_id: input_boolean.maintenance_mode
    state:
    - 'off'
  actions:
  - target:
      entity_id: climate.thermostat
    data:
      hvac_mode: 'off'
    action: climate.set_hvac_mode
  - data:
      payload: "{\n  \"source\": \"watchdog\",\n  \"event\": \":rotating_light: CRITICAL
        — HVAC Protection Triggered\",\n  \"entity_id\": \"sensor.hvac_anomaly_score\",\n
        \ \"state\": \"{{ states('sensor.hvac_anomaly_score') }}\",\n  \"friendly_name\":
        \"HVAC Anomaly Score\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  - target:
      entity_id: input_boolean.hvac_protection_active
    action: input_boolean.turn_on
  - delay:
      minutes: 10
  - target:
      entity_id: climate.thermostat
    data:
      hvac_mode: cool
    action: climate.set_hvac_mode
  - target:
      entity_id: input_boolean.hvac_protection_active
    action: input_boolean.turn_off
  mode: single
- id: '1784774631221'
  alias: HVAC Protection – Recovery
  description: Sends recovery notice and resets protection state
  triggers:
  - entity_id: input_boolean.hvac_protection_active
    to: 'off'
    for:
      minutes: 1
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.maintenance_mode
    state:
    - 'off'
  actions:
  - data:
      payload: "{\n  \"source\": \"watchdog\",\n  \"event\": \":white_check_mark:
        HVAC Protection Cleared\",\n  \"entity_id\": \"sensor.hvac_anomaly_score\",\n
        \ \"state\": \"{{ states('sensor.hvac_anomaly_score') }}\",\n  \"friendly_name\":
        \"HVAC Anomaly Score\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  - data:
      name: HVAC Protection
      message: System recovered and cooling resumed.
      entity_id: climate.thermostat
    action: logbook.log
  mode: single
- id: '1784775025451'
  alias: Stage 3 - Vacation Return Prep Mode
  description: Activates HVAC prep the night before returning from vacation
  triggers:
  - at: 00:00:00
    trigger: time
