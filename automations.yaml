      }}\n"
  - condition: template
    value_template: '{{ states(''climate.thermostat'') != ''off'' }}

      '
  actions:
  - target:
      entity_id: input_boolean.return_prep_mode
    action: input_boolean.turn_on
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.outdoor_blend_temp
        below: 45
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          temperature: 68
        action: climate.set_temperature
    - conditions:
      - condition: numeric_state
        entity_id: sensor.outdoor_blend_temp
        above: 45
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          temperature: 74
        action: climate.set_temperature
  - target:
      entity_id: input_text.vacation_mode_heartbeat
    data:
      value: Return Prep Activated — {{ now().isoformat() }}
    action: input_text.set_value
  - data:
      payload: "{\n  \"source\": \"return\",\n  \"event\": \":house_with_garden: Midnight
        Return Prep Mode Activated\",\n  \"entity_id\": \"input_boolean.return_prep_mode\",\n
        \ \"state\": \"{{ states('input_boolean.return_prep_mode') }}\",\n  \"friendly_name\":
        \"Return Prep Mode\",\n  \"timestamp\": \"{{ now().isoformat() }}\"\n}\n"
    action: rest_command.slack_webhook_prod
  mode: single
- id: '1784776110965'
  alias: Stage 4 - Vacation Mode Deactivation Logic
  description: Restores HVAC whenever vacation mode ends
  triggers:
  - entity_id: input_boolean.vacation_mode
    to: 'off'
    trigger: state
  - event: start
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: input_boolean.vacation_mode
    state: 'off'
  actions:
  - target:
      entity_id: climate.thermostat
    data:
      hvac_mode: '{{ states(''input_text.previous_hvac_mode'') }}'
    action: climate.set_hvac_mode
  - target:
      entity_id: climate.thermostat
    data:
      temperature: '{{ states(''input_number.previous_hvac_setpoint'') | float }}'
    action: climate.set_temperature
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hvac_paused
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hvac_protection_active
  - target:
      entity_id: input_text.vacation_mode_heartbeat
    data:
      value: Vacation Mode Deactivated — {{ now().isoformat() }}
    action: input_text.set_value
  - data:
      payload: "{\n  \"text\": \":house: *Welcome Home — HVAC Restored*\\n\n  • *Indoor
        Temp:* {{ states('sensor.indoor_temperature') or 'unknown' }}°F\\n\n  • *Outdoor
        Temp:* {{ states('sensor.outdoor_blend_temp') or 'unknown' }}°F\\n\n  • *Humidity:*
        {{ states('sensor.outdoor_humidity') or 'unknown' }}%\\n\n  • *HVAC Mode:*
        {{ states('input_text.previous_hvac_mode') or 'unknown' }}\\n\n  • *Setpoint:*
        {{ states('input_number.previous_hvac_setpoint') or 'unknown' }}°F\\n\n  •
        *Timestamp:* {{ now().isoformat() }}\\n\"\n}\n"
    action: rest_command.slack_webhook_prod
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.return_prep_mode
  mode: single
