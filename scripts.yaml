temporary_boost_heat:
  alias: Temporary Boost Heat
  mode: single
  sequence:
  - variables:
      mode: '{{ states(''climate.thermostat'') }}'
  - variables:
      current_low: '{{ state_attr(''climate.thermostat'', ''target_temp_low'') | float(0)
        }}'
      current_high: '{{ state_attr(''climate.thermostat'', ''target_temp_high'') |
        float(0) }}'
      current_single: '{{ state_attr(''climate.thermostat'', ''temperature'') | float(0)
        }}'
  - variables:
      current: "{% if mode == 'heat_cool' %}\n  {{ current_low }}\n{% elif mode ==
        'heat' %}\n  {{ current_single }}\n{% else %}\n  {{ current_single }}\n{%
        endif %}\n"
  - target:
      entity_id: input_number.original_low_temp
    data:
      value: '{{ current_low }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.original_high_temp
    data:
      value: '{{ current_high }}'
    action: input_number.set_value
  - target:
      entity_id: input_number.original_single_temp
    data:
      value: '{{ current_single }}'
    action: input_number.set_value
  - variables:
      new: '{{ [current + 2, 50] | max }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ mode == ''heat_cool'' }}'
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          target_temp_low: '{{ new }}'
          target_temp_high: '{{ current_high }}'
        action: climate.set_temperature
      - target:
          entity_id: input_boolean.temporary_boost_active
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.temporary_boost_direction_lock
        action: input_boolean.turn_on
      - target:
          entity_id: timer.temporary_comfort_timer
        action: timer.start
    - conditions:
      - condition: template
        value_template: '{{ mode == ''heat'' }}'
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          temperature: '{{ new }}'
        action: climate.set_temperature
      - target:
          entity_id: input_boolean.temporary_boost_active
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.temporary_boost_direction_lock
        action: input_boolean.turn_on
      - target:
          entity_id: timer.temporary_comfort_timer
        action: timer.start
    - conditions:
      - condition: template
        value_template: '{{ mode == ''cool'' }}'
      sequence:
      - target:
          entity_id: input_boolean.temporary_boost_active
        action: input_boolean.turn_on
      - target:
          entity_id: input_boolean.temporary_boost_direction_lock
        action: input_boolean.turn_on
      - target:
          entity_id: timer.temporary_comfort_timer
        action: timer.start
  description: ''
