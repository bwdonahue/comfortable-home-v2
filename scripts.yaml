temporary_comfort_reset:
  alias: Temporary Comfort Reset
  mode: single
  sequence:
  - variables:
      mode: '{{ states(''climate.thermostat'') }}'
      orig_low: '{{ states(''input_number.original_low_temp'') | float }}'
      orig_high: '{{ states(''input_number.original_high_temp'') | float }}'
      orig_single: '{{ states(''input_number.original_single_temp'') | float }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ mode == ''heat_cool'' }}'
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          target_temp_low: '{{ orig_low }}'
          target_temp_high: '{{ orig_high }}'
        action: climate.set_temperature
    - conditions:
      - condition: template
        value_template: '{{ mode == ''heat'' }}'
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          temperature: '{{ orig_single }}'
        action: climate.set_temperature
    - conditions:
      - condition: template
        value_template: '{{ mode == ''cool'' }}'
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          temperature: '{{ orig_single }}'
        action: climate.set_temperature
  - target:
      entity_id: input_boolean.temporary_boost_active
    action: input_boolean.turn_off
  - target:
      entity_id: input_boolean.temporary_boost_direction_lock
    action: input_boolean.turn_off
  - target:
      entity_id: timer.temporary_comfort_timer
    action: timer.cancel
  - target:
      entity_id: input_text.current_active_automation
    data:
      value: ''
    action: input_text.set_value
