# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include_dir_merge_list templates/

recorder:
  purge_keep_days: 30
  auto_purge: true
notify:
  - name: sendgrid
    platform: sendgrid
    api_key: !secret sendgrid_api_key
    sender: homeassistant@realdeep.net
    recipient: bryandonahue@gmail.com

rest_command:
  sendgrid_html:
    url: "https://api.sendgrid.com/v3/mail/send"
    method: POST
    headers:
      Authorization: !secret sendgrid_bearer
      Content-Type: "application/json"
    payload: >
      {
        "personalizations": [{
          "to": [{"email": "bryandonahue@gmail.com"}]
        }],
        "from": {"email": "homeassistant@realdeep.net"},
        "subject": "{{ subject }}",
        "content": [{
          "type": "text/html",
          "value": "{{ body }}"
        }]
      }

  log_to_notion:
    url: !secret notion_webhook_url
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {{ payload }}

  slack_webhook_prod:
    url: !secret make_webhook_prod_url
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {{ payload }}

  uptimerobot_pause:
    url: "https://api.uptimerobot.com/v2/editMonitor"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    payload: >
      api_key={{ states('input_text.uptimerobot_api_key_holder') }}&id=802207036&status=0

  uptimerobot_resume:
    url: "https://api.uptimerobot.com/v2/editMonitor"
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    payload: >
      api_key={{ states('input_text.uptimerobot_api_key_holder') }}&id=802207036&status=1

  milo_dev_event:
    url: "http://192.168.0.18:5001/ha/event"
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "entity": "{{ entity }}",
        "old": "{{ old }}",
        "new": "{{ new }}"
      }

  milo_prod_event:
    url: "http://192.168.0.17:5001/ha/event"
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "entity": "{{ entity }}",
        "old": "{{ old }}",
        "new": "{{ new }}"
      }

input_select:
  milo_target:
    name: Milo Target Environment
    options:
      - dev
      - prod
    initial: dev
